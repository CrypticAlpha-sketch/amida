<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF編集</title>
<meta name="description" content="ブラウザだけで動くPDF編集ツール。結合・並べ替え・回転・削除・文字入れ・手書き・墨消し。ファイルは送信されません。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --ink:#18181a; --muted:#6c6c70; --faint:#9a9a9e;
  --line:#e4e4df; --line-strong:#d2d2cc; --desk:#e9e9e5; --hover:#f0f0ec;
  --accent:#e0452b; --accent-ink:#ffffff; --accent-soft:#fbe6e1;
  --shadow:0 1px 2px rgba(20,20,20,.06),0 4px 16px rgba(20,20,20,.06);
  --page-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);
  --r:6px;
  --font:"Geist","Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --surface:#1c1c1f; --ink:#ececea; --muted:#a0a0a6; --faint:#6e6e74;
    --line:#2a2a2e; --line-strong:#3a3a40; --desk:#0e0e10; --hover:#25252a;
    --accent:#f05a40; --accent-ink:#ffffff; --accent-soft:#3a1f1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    --page-shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1c1c1f; --ink:#ececea; --muted:#a0a0a6; --faint:#6e6e74;
  --line:#2a2a2e; --line-strong:#3a3a40; --desk:#0e0e10; --hover:#25252a;
  --accent:#f05a40; --accent-ink:#ffffff; --accent-soft:#3a1f1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --page-shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  display:grid;grid-template-rows:auto auto 1fr;height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* ---------- header ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:22px;height:22px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.fname{flex:1;min-width:0;display:flex;justify-content:center}
.fname input{width:min(420px,100%);border:1px solid transparent;background:transparent;border-radius:var(--r);padding:5px 10px;text-align:center;color:var(--muted);transition:border-color .15s,background .15s}
.fname input:hover{border-color:var(--line)}
.fname input:focus{outline:none;border-color:var(--line-strong);background:var(--bg);color:var(--ink)}
.actions{display:flex;gap:8px}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:16px;height:16px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.group{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.ib{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;border-radius:var(--r);background:transparent;cursor:pointer;color:var(--muted);transition:background .15s,color .15s,transform .08s}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:active{transform:translateY(1px)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default;background:transparent;transform:none}
.ib svg{width:18px;height:18px}
.ib:focus:not(:focus-visible),.btn:focus:not(:focus-visible){outline:none}
.ib:focus-visible,.btn:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ib[data-tip]:hover::after{content:attr(data-tip);position:fixed;transform:translate(-50%,40px);background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:50}
.swatches{display:flex;gap:4px;align-items:center}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cpick{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.cpick::-webkit-color-swatch-wrapper{padding:0}
.cpick::-webkit-color-swatch{border-radius:50%;border:1px dashed var(--line-strong)}
.size{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.size input{width:96px;accent-color:var(--accent)}
.size output{min-width:30px}
.zoom{margin-left:auto;display:flex;align-items:center;gap:2px}
.zoom .val{min-width:52px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;border:0;background:none;cursor:pointer;border-radius:var(--r);height:34px}
.zoom .val:hover{background:var(--hover)}
.pageno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 8px;white-space:nowrap}

/* ---------- main ---------- */
main{display:grid;grid-template-columns:212px 1fr;min-height:0;position:relative}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:12px;color:var(--muted)}
.side-tools{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.side-tools .ib{width:100%;height:30px}
.side-tools .ib[data-tip]:hover::after{transform:translate(-50%,34px)}
.thumbs{flex:1;overflow-y:auto;padding:12px 0 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.thumb{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;border-radius:8px;user-select:none;-webkit-user-select:none}
.thumb .tc{position:relative;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.06);border-radius:2px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.thumb:hover .tc{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line-strong),0 4px 12px rgba(0,0,0,.1)}
.thumb .tc canvas{position:absolute;inset:0;width:100%;height:100%}
.thumb .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb.current .n{color:var(--ink);font-weight:600}
.thumb.sel .tc{box-shadow:0 0 0 2px var(--accent)}
.thumb.sel{background:var(--accent-soft)}
.thumb.drop-before::before,.thumb.drop-after::after{content:"";position:absolute;left:12px;right:12px;height:3px;border-radius:2px;background:var(--accent)}
.thumb.drop-before::before{top:-9px}
.thumb.drop-after::after{bottom:-9px}
.thumb.dragging{opacity:.4}

#stage{overflow:auto;background:var(--desk);position:relative;min-width:0}
#pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:28px 24px 80px;min-width:max-content}
.page{position:relative;background:#fff;box-shadow:var(--page-shadow);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.page .ac{touch-action:none}
#stage.t-select .page .ac{touch-action:auto}
.page .ac{cursor:crosshair}
#stage.t-select .page .ac{cursor:default}
#stage.t-select .page .ac.over{cursor:move}
#stage.t-select .page .ac.over-rs{cursor:nwse-resize}
#stage.t-text .page .ac{cursor:text}
.page .plabel{position:absolute;left:-2px;top:-20px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.ted{position:absolute;z-index:5;margin:0;padding:0;border:1px dashed var(--accent);background:rgba(255,255,255,.6);outline:none;resize:none;overflow:hidden;line-height:1.3;white-space:pre;min-width:2ch;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}

/* empty */
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.drop{width:min(560px,100%);border:1.5px dashed var(--line-strong);border-radius:12px;background:var(--surface);padding:48px 32px;text-align:center;transition:border-color .15s,background .15s}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop h1{font-size:22px;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
.drop p{margin:0 0 22px;color:var(--muted)}
.drop .btn{height:40px;padding:0 18px}
.feat{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:26px}
.feat span{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.note{margin-top:18px;font-size:12px;color:var(--faint)}
.dropmask{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);border:3px dashed var(--accent);pointer-events:none;font-weight:600;color:var(--accent);font-size:18px}
.dropmask.on{display:grid}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:20px}
.dlg h2{margin:0 0 16px;font-size:16px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:12px;color:var(--muted)}
.field input[type=text]{height:36px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 10px;background:var(--bg)}
.field input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.check{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.prog{font-size:12px;color:var(--muted);margin-right:auto;align-self:center}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

.only-m{display:none}
@media (max-width:760px){
  main{grid-template-columns:1fr}
  aside{position:absolute;z-index:20;left:0;top:0;bottom:0;width:212px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .only-m{display:grid}
  .brand .t{display:none}
  .actions .btn .t{display:none}
  .actions .btn{padding:0 10px}
  #pages{padding:24px 16px 80px}
  .size input{width:72px}
}
</style>
</head>
<body>
<header class="bar">
  <button class="ib only-m" id="btnSide" aria-label="ページ一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand"><span class="brand-mark"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M14 3H6v18h12V8z"/></svg></span><span class="t">PDF編集</span></div>
  <div class="fname"><input id="fname" value="document.pdf" aria-label="ファイル名" spellcheck="false"></div>
  <div class="actions">
    <button class="btn" id="btnOpen" title="PDFや画像を追加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span class="t">追加</span></button>
    <button class="btn primary" id="btnExport" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="t">保存</span></button>
  </div>
  <input type="file" id="fileIn" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp" multiple hidden>
  <input type="file" id="imgIn" accept="image/png,image/jpeg,image/webp" hidden>
</header>

<div class="toolbar" id="toolbar">
  <div class="group" id="tools">
    <button class="ib" data-tool="select" data-tip="選択・移動 (V)" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
    <button class="ib" data-tool="text" data-tip="テキスト (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <button class="ib" data-tool="pen" data-tip="ペン (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
    <button class="ib" data-tool="hl" data-tip="マーカー (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l-3 3h4l1-1"/><path d="M9 15l7-10 4 3-7 10z"/><path d="M4 21h16" opacity=".5"/></svg></button>
    <button class="ib" data-tool="rect" data-tip="四角 (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button class="ib" data-tool="arrow" data-tip="矢印 (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button class="ib" data-tool="white" data-tip="白で塗りつぶし・墨消し (W)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1"/><path d="M4 14l6-8M8 18l10-12M14 18l6-7" stroke-width="1.4"/></svg></button>
    <button class="ib" id="btnImg" data-tip="画像・印影を挿入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l5-4 3 2 3-3 4 4"/></svg></button>
  </div>
  <span class="sep"></span>
  <div class="group swatches" id="swatches"></div>
  <input type="color" class="cpick" id="cpick" aria-label="色を選ぶ">
  <span class="sep"></span>
  <label class="size"><span id="sizeLbl">太さ</span><input type="range" id="size" min="1" max="40" step="1"><output id="sizeOut"></output></label>
  <span class="sep"></span>
  <div class="group">
    <button class="ib" id="btnUndo" data-tip="元に戻す (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="ib" id="btnRedo" data-tip="やり直す (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="ib" id="btnDelAnn" data-tip="選択を削除 (Delete)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div class="zoom">
    <span class="pageno" id="pageno"></span>
    <button class="ib" id="zOut" data-tip="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
    <button class="val" id="zVal" title="幅に合わせる">100%</button>
    <button class="ib" id="zIn" data-tip="拡大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
  </div>
</div>

<main>
  <aside id="side">
    <div class="side-head"><span id="pcount">0 ページ</span><span id="selInfo"></span></div>
    <div class="side-tools">
      <button class="ib" id="pRotL" data-tip="左に回転"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5"/><path d="M4.5 9A8 8 0 1112 20"/></svg></button>
      <button class="ib" id="pRotR" data-tip="右に回転"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v5h-5"/><path d="M19.5 9A8 8 0 1012 20"/></svg></button>
      <button class="ib" id="pDup" data-tip="複製"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg></button>
      <button class="ib" id="pBlank" data-tip="白紙ページを挿入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M12 11v6M9 14h6"/></svg></button>
      <button class="ib" id="pDel" data-tip="ページを削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M9 14h6"/></svg></button>
      <button class="ib" id="pExtract" data-tip="選択ページだけ保存"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M12 10v7M9 14l3 3 3-3"/></svg></button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </aside>
  <section id="stage" class="t-select">
    <div id="pages"></div>
    <div class="empty" id="empty">
      <div class="drop" id="drop">
        <h1>PDFをここにドロップ</h1>
        <p>複数のPDFや画像を入れると、その順に1つにまとまります。</p>
        <button class="btn primary" id="btnOpen2">ファイルを選ぶ</button>
        <div class="feat"><span>結合</span><span>並べ替え</span><span>回転</span><span>削除・抽出</span><span>文字入れ</span><span>手書き・署名</span><span>マーカー</span><span>墨消し</span><span>画像・印影</span><span>ページ番号</span></div>
        <div class="note">ファイルはこのブラウザの中だけで処理され、どこにも送信されません。</div>
      </div>
    </div>
  </section>
</main>

<div class="dropmask" id="dropmask">ドロップして追加</div>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="dlgForm">
    <h2>PDFを保存</h2>
    <div class="field"><label for="outName">ファイル名</label><input type="text" id="outName" spellcheck="false"></div>
    <div class="lbl">保存するページ</div>
    <label class="check"><input type="radio" name="range" value="all" checked> すべてのページ <span id="cntAll" style="color:var(--muted)"></span></label>
    <label class="check"><input type="radio" name="range" value="sel" id="rSel"> 選択したページのみ <span id="cntSel" style="color:var(--muted)"></span></label>
    <div class="lbl" style="margin-top:10px">オプション</div>
    <label class="check"><input type="checkbox" id="optNum"> ページ番号を下に入れる</label>
    <label class="check" id="optRedWrap"><input type="checkbox" id="optRed" checked> 塗りつぶしたページは画像にする <span style="color:var(--muted)">（下の文字を完全に消す）</span></label>
    <div class="dlg-foot">
      <span class="prog" id="prog"></span>
      <button class="btn" value="cancel" formnovalidate>キャンセル</button>
      <button class="btn primary" id="doExport" value="ok">保存する</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(() => {
'use strict';
const pdfjsLib = window['pdfjs-dist/build/pdf'];
if (!pdfjsLib || !window.PDFLib) {
  document.getElementById('drop').innerHTML = '<h1>ライブラリを読み込めませんでした</h1><p>インターネット接続を確認して、ページを再読み込みしてください。</p>';
  return;
}
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const { PDFDocument, degrees } = PDFLib;

const $ = s => document.querySelector(s);
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
const SWATCHES = ['#18181a', '#e0452b', '#1f6feb', '#2f9e44', '#f59f00', '#ffe066', '#ff8cc6', '#ffffff'];
const BOX_TYPES = new Set(['rect', 'white', 'image']);

/* ------------ state ------------ */
const S = {
  docs: [],            // {name, bytes, pdf, pages: Map}
  pages: [],           // {id, doc, index, w, h, r0, rot, ann:[]}
  tool: 'select',
  props: {
    text:  { color: '#18181a', size: 16 },
    pen:   { color: '#1f6feb', size: 2 },
    hl:    { color: '#ffe066', size: 14 },
    rect:  { color: '#e0452b', size: 2 },
    arrow: { color: '#e0452b', size: 2 },
    white: { color: '#ffffff', size: 0 },
  },
  zoom: 1,
  sel: null,           // {pid, aid}
  tsel: new Set(),     // selected page ids (thumbnails)
  anchor: null,
  cur: 0,              // current page index
  undo: [], redo: [],
};
let uid = 1;
const views = new Map();  // page id -> view
let pageById = new Map();

/* ------------ geometry ------------ */
// maps a w×h space onto the same space rotated r° clockwise: [a,b,c,d,e,f]
function rotMat(r, w, h) {
  switch ((r % 360 + 360) % 360) {
    case 90: return [0, 1, -1, 0, h, 0];
    case 180: return [-1, 0, 0, -1, w, h];
    case 270: return [0, -1, 1, 0, 0, w];
    default: return [1, 0, 0, 1, 0, 0];
  }
}
const ap = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
const viewDims = p => (p.rot % 180 ? [p.h, p.w] : [p.w, p.h]);

/* ------------ helpers ------------ */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}
const readURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const isTyping = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' && a.type === 'text' || a.tagName === 'TEXTAREA'); };

const mctx = document.createElement('canvas').getContext('2d');
function textBox(a) {
  mctx.font = `${a.size}px ${FONT}`;
  const lines = (a.text || '').split('\n');
  let w = 0; for (const l of lines) w = Math.max(w, mctx.measureText(l).width);
  return { x: a.x, y: a.y, w: Math.max(w, a.size * .5), h: lines.length * a.size * 1.3 };
}
function bbox(a) {
  switch (a.type) {
    case 'pen': case 'hl': {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const [x, y] of a.pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
      const s = a.size / 2; return { x: x0 - s, y: y0 - s, w: x1 - x0 + a.size, h: y1 - y0 + a.size };
    }
    case 'arrow': {
      const s = a.size * 2 + 4;
      return { x: Math.min(a.x1, a.x2) - s, y: Math.min(a.y1, a.y2) - s, w: Math.abs(a.x2 - a.x1) + s * 2, h: Math.abs(a.y2 - a.y1) + s * 2 };
    }
    case 'text': return textBox(a);
    default: return { x: Math.min(a.x, a.x + a.w), y: Math.min(a.y, a.y + a.h), w: Math.abs(a.w), h: Math.abs(a.h) };
  }
}
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy;
  let t = l ? ((px - x1) * dx + (py - y1) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - x1 - t * dx, py - y1 - t * dy);
}
function hit(a, x, y, tol) {
  if (a.type === 'pen' || a.type === 'hl') {
    const r = a.size / 2 + tol, p = a.pts;
    if (p.length === 1) return Math.hypot(x - p[0][0], y - p[0][1]) <= r;
    for (let i = 1; i < p.length; i++) if (segDist(x, y, p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]) <= r) return true;
    return false;
  }
  if (a.type === 'arrow') return segDist(x, y, a.x1, a.y1, a.x2, a.y2) <= a.size / 2 + tol + 2;
  const b = bbox(a);
  return x >= b.x - tol && x <= b.x + b.w + tol && y >= b.y - tol && y <= b.y + b.h + tol;
}

/* ------------ drawing annotations ------------ */
function drawOne(ctx, a) {
  if (a._editing) return;
  ctx.save();
  switch (a.type) {
    case 'pen': case 'hl': {
      ctx.strokeStyle = a.color; ctx.lineWidth = a.size; ctx.lineJoin = 'round';
      ctx.lineCap = a.type === 'hl' ? 'square' : 'round';

      const p = a.pts;
      ctx.beginPath();
      if (p.length === 1) { ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[0][0] + .01, p[0][1]); }
      else {
        ctx.moveTo(p[0][0], p[0][1]);
        for (let i = 1; i < p.length - 1; i++) {
          const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
          ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my);
        }
        ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
      }
      ctx.stroke(); break;
    }
    case 'rect': {
      ctx.strokeStyle = a.color; ctx.lineWidth = a.size;
      const b = bbox(a); ctx.strokeRect(b.x, b.y, b.w, b.h); break;
    }
    case 'white': {
      ctx.fillStyle = a.color; const b = bbox(a); ctx.fillRect(b.x, b.y, b.w, b.h); break;
    }
    case 'arrow': {
      ctx.strokeStyle = ctx.fillStyle = a.color; ctx.lineWidth = a.size; ctx.lineCap = 'round';
      const ang = Math.atan2(a.y2 - a.y1, a.x2 - a.x1), hl = Math.max(8, a.size * 4);
      const bx = a.x2 - Math.cos(ang) * hl * .8, by = a.y2 - Math.sin(ang) * hl * .8;
      ctx.beginPath(); ctx.moveTo(a.x1, a.y1); ctx.lineTo(bx, by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(a.x2, a.y2);
      ctx.lineTo(a.x2 - Math.cos(ang - .45) * hl, a.y2 - Math.sin(ang - .45) * hl);
      ctx.lineTo(a.x2 - Math.cos(ang + .45) * hl, a.y2 - Math.sin(ang + .45) * hl);
      ctx.closePath(); ctx.fill(); break;
    }
    case 'text': {
      ctx.fillStyle = a.color; ctx.font = `${a.size}px ${FONT}`; ctx.textBaseline = 'top';
      a.text.split('\n').forEach((l, i) => ctx.fillText(l, a.x, a.y + i * a.size * 1.3 + a.size * .12));

    case 'image': {
      if (a.img && a.img.complete) { const b = bbox(a); ctx.drawImage(a.img, b.x, b.y, b.w, b.h); }

}
function drawSel(ctx, a, k) {
  const b = bbox(a), pad = 3 / k;
  ctx.save();

  ctx.lineWidth = 1.2 / k; ctx.setLineDash([4 / k, 3 / k]);
  ctx.strokeRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2);
  if (BOX_TYPES.has(a.type) || a.type === 'text') {
    ctx.setLineDash([]); ctx.fillStyle = '#fff';
    const s = 8 / k, hx = b.x + b.w + pad, hy = b.y + b.h + pad;
    ctx.fillRect(hx - s / 2, hy - s / 2, s, s); ctx.strokeRect(hx - s / 2, hy - s / 2, s, s);

}
function handleHit(a, x, y, k) {
  if (!(BOX_TYPES.has(a.type) || a.type === 'text')) return false;
  const b = bbox(a), pad = 3 / k, r = 9 / k;
  return Math.abs(x - (b.x + b.w + pad)) <= r && Math.abs(y - (b.y + b.h + pad)) <= r;
}

/* ------------ undo ------------ */
const cloneAnn = a => ({ ...a, pts: a.pts ? a.pts.map(q => q.slice()) : undefined });
const snap = () => S.pages.map(p => ({ ...p, ann: p.ann.map(cloneAnn) }));
function pushUndo() { S.undo.push(snap()); if (S.undo.length > 100) S.undo.shift(); S.redo = []; updButtons(); }
function undo() { if (!S.undo.length) return; commitEditor(true); S.redo.push(snap()); S.pages = S.undo.pop(); S.sel = null; rebuild(true); }
function redo() { if (!S.redo.length) return; commitEditor(true); S.undo.push(snap()); S.pages = S.redo.pop(); S.sel = null; rebuild(true); }

/* ------------ loading ------------ */
async function getPdfPage(di, i) {
  const d = S.docs[di];
  if (!d.pages.has(i)) d.pages.set(i, d.pdf.getPage(i + 1));
  return d.pages.get(i);
}
async function addFiles(files, at) {
  files = [...files];
  if (!files.length) return;
  const added = [];
  const wasEmpty = !S.pages.length;
  for (const f of files) {
    try {
      if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
        const bytes = new Uint8Array(await f.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
        const di = S.docs.push({ name: f.name, bytes, pdf, pages: new Map() }) - 1;
        for (let i = 0; i < pdf.numPages; i++) {
          const pg = await getPdfPage(di, i);
          const vp = pg.getViewport({ scale: 1 });
          added.push({ id: uid++, doc: di, index: i, w: vp.width, h: vp.height, r0: pg.rotate || 0, rot: 0, ann: [] });
        }
        if (wasEmpty && $('#fname').value === 'document.pdf') $('#fname').value = f.name.replace(/\.pdf$/i, '') + '_編集.pdf';
      } else if (f.type.startsWith('image/')) {
        const src = await readURL(f), img = await loadImg(src);
        const k = 842 / Math.max(img.naturalWidth, img.naturalHeight);
        const w = img.naturalWidth * k, h = img.naturalHeight * k;
        added.push({ id: uid++, doc: null, index: 0, w, h, r0: 0, rot: 0, ann: [{ id: uid++, type: 'image', x: 0, y: 0, w, h, src, img }] });
      } else {
        toast(`${f.name} は対応していない形式です`);
      }
    } catch (e) {
      console.error(e);
      toast(e && e.name === 'PasswordException' ? `${f.name} はパスワード付きのため開けません` : `${f.name} を開けませんでした`);
    }
  }
  if (!added.length) return;
  pushUndo();
  const idx = at == null ? S.pages.length : at;
  S.pages.splice(idx, 0, ...added);
  if (wasEmpty) S.zoom = fitZoom();
  rebuild();
  if (!wasEmpty) { scrollToPage(idx); }
  toast(`${added.length} ページを追加しました`);
}

/* ------------ views ------------ */
const pagesEl = $('#pages'), thumbsEl = $('#thumbs'), stage = $('#stage');
const io = new IntersectionObserver(ents => {
  for (const e of ents) {
    const v = e.target._view; if (!v) continue;
    if (e.target === v.wrap) { v.vis = e.isIntersecting; if (v.vis) renderPage(v); }
    else { v.tvis = e.isIntersecting; if (v.tvis) renderThumb(v); }
  }
}, { rootMargin: '800px 0px' });

function makeView(p) {
  const v = { id: p.id, key: null, tkey: null, vis: false, tvis: false };
  v.wrap = document.createElement('div'); v.wrap.className = 'page';
  v.pc = document.createElement('canvas'); v.pc.className = 'pc';
  v.ac = document.createElement('canvas'); v.ac.className = 'ac';
  v.label = document.createElement('div'); v.label.className = 'plabel';
  v.wrap.append(v.pc, v.ac, v.label);
  v.wrap._view = v;
  bindPointer(v);

  v.thumb = document.createElement('div'); v.thumb.className = 'thumb'; v.thumb.draggable = true;
  v.tc = document.createElement('div'); v.tc.className = 'tc';
  v.tp = document.createElement('canvas'); v.ta = document.createElement('canvas');
  v.tc.append(v.tp, v.ta);
  v.tn = document.createElement('div'); v.tn.className = 'n';
  v.thumb.append(v.tc, v.tn);
  v.thumb._view = v;
  bindThumb(v);
  io.observe(v.wrap); io.observe(v.thumb);
  views.set(p.id, v);
  return v;
}

function rebuild(keepScroll) {
  pageById = new Map(S.pages.map(p => [p.id, p]));
  for (const [id, v] of views) if (!pageById.has(id)) { io.unobserve(v.wrap); io.unobserve(v.thumb); v.wrap.remove(); v.thumb.remove(); views.delete(id); }
  for (const id of [...S.tsel]) if (!pageById.has(id)) S.tsel.delete(id);
  if (S.sel && !pageById.has(S.sel.pid)) S.sel = null;
  S.pages.forEach((p, i) => {
    const v = views.get(p.id) || makeView(p);
    if (pagesEl.children[i] !== v.wrap) pagesEl.insertBefore(v.wrap, pagesEl.children[i] || null);
    if (thumbsEl.children[i] !== v.thumb) thumbsEl.insertBefore(v.thumb, thumbsEl.children[i] || null);
    layout(v, p, i);
  });
  $('#empty').style.display = S.pages.length ? 'none' : '';
  $('#pcount').textContent = `${S.pages.length} ページ`;
  $('#zVal').textContent = Math.round(S.zoom * 100) + '%';
  S.cur = Math.min(S.cur, Math.max(0, S.pages.length - 1));
  updButtons(); updThumbSel(); updCurrent();
}

function layout(v, p, i) {
  const [vw, vh] = viewDims(p);
  v.wrap.style.width = Math.round(vw * S.zoom) + 'px';
  v.wrap.style.height = Math.round(vh * S.zoom) + 'px';
  v.label.textContent = i + 1;
  v.tn.textContent = i + 1;
  const tw = 120, th = Math.round(tw * vh / vw);
  const tW = th > 170 ? Math.round(170 * vw / vh) : tw, tH = Math.min(th, 170);
  v.tc.style.width = tW + 'px'; v.tc.style.height = tH + 'px';
  if (v.vis) renderPage(v); else if (v.key && v.key !== pageKey(p)) v.key = 'stale';
  drawAnnView(v);
  if (v.tvis) renderThumb(v);
}

const pageKey = p => `${S.zoom}|${p.rot}`;
async function renderPage(v) {
  const p = pageById.get(v.id); if (!p) return;
  const key = pageKey(p);
  sizeAnn(v, p);
  if (v.key === key) return;
  v.key = key;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), sc = S.zoom * dpr;
  if (p.doc == null) {
    const c = v.pc; c.width = 2; c.height = 2; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 2, 2);
    return;
  }
  const pg = await getPdfPage(p.doc, p.index);
  const vp = pg.getViewport({ scale: sc, rotation: (p.r0 + p.rot) % 360 });
  const c = document.createElement('canvas'); c.className = 'pc';
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  if (v.task) { try { v.task.cancel(); } catch (_) {} }
  const task = pg.render({ canvasContext: c.getContext('2d'), viewport: vp });
  v.task = task;
  try { await task.promise; } catch (e) { if (e && e.name === 'RenderingCancelledException') return; console.error(e); return; }
  if (v.task !== task) return;
  v.task = null;
  v.wrap.replaceChild(c, v.pc); v.pc = c;
}
function sizeAnn(v, p) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), sc = S.zoom * dpr;
  const [vw, vh] = viewDims(p);
  const W = Math.ceil(vw * sc), H = Math.ceil(vh * sc);
  if (v.ac.width !== W || v.ac.height !== H) { v.ac.width = W; v.ac.height = H; drawAnnView(v); }
}
function drawAnnView(v) {
  const p = pageById.get(v.id); if (!p) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), sc = S.zoom * dpr;
  const g = v.ac.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, v.ac.width, v.ac.height);
  g.scale(sc, sc); g.transform(...rotMat(p.rot, p.w, p.h));
  for (const a of p.ann) drawOne(g, a);
  if (S.sel && S.sel.pid === p.id) { const a = p.ann.find(x => x.id === S.sel.aid); if (a) drawSel(g, a, S.zoom); }
}
const thumbTimers = new Map();
function schedThumb(v) {
  clearTimeout(thumbTimers.get(v.id));
  thumbTimers.set(v.id, setTimeout(() => { if (v.tvis) renderThumbAnn(v); }, 250));
}
async function renderThumb(v) {
  const p = pageById.get(v.id); if (!p) return;
  const key = `${p.rot}|${v.tc.style.width}`;
  renderThumbAnn(v);
  if (v.tkey === key) return; v.tkey = key;
  const [vw] = viewDims(p);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sc = parseFloat(v.tc.style.width) / vw * dpr;
  if (p.doc == null) { v.tp.width = v.tp.height = 1; return; }
  const pg = await getPdfPage(p.doc, p.index);
  const vp = pg.getViewport({ scale: sc, rotation: (p.r0 + p.rot) % 360 });
  const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  try { await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; } catch (e) { return; }
  if (v.tkey !== key) return;
  v.tc.replaceChild(c, v.tp); v.tp = c;
}
function renderThumbAnn(v) {
  const p = pageById.get(v.id); if (!p) return;
  const [vw, vh] = viewDims(p);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sc = parseFloat(v.tc.style.width) / vw * dpr;
  const W = Math.ceil(vw * sc), H = Math.ceil(vh * sc);
  if (v.ta.width !== W) v.ta.width = W; if (v.ta.height !== H) v.ta.height = H;
  const g = v.ta.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  g.scale(sc, sc); g.transform(...rotMat(p.rot, p.w, p.h));
  for (const a of p.ann) drawOne(g, a);
}
function refresh(pid) {
  const v = views.get(pid); if (!v) return;
  drawAnnView(v); schedThumb(v);
}

/* ------------ pointer interaction ------------ */
let drag = null;
function toBase(v, p, e) {
  const r = v.wrap.getBoundingClientRect();
  const [vw, vh] = viewDims(p);
  const vx = (e.clientX - r.left) / S.zoom, vy = (e.clientY - r.top) / S.zoom;
  return ap(rotMat(360 - p.rot, vw, vh), vx, vy);
}
function bindPointer(v) {
  const el = v.ac;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const p = pageById.get(v.id); if (!p) return;
    setCurrent(S.pages.indexOf(p));
    if (commitEditor()) { e.preventDefault(); return; }
    const [x, y] = toBase(v, p, e);
    const tool = S.tool, pr = S.props[tool];

    if (tool === 'select') {
      const tol = 4 / S.zoom;
      const selA = S.sel && S.sel.pid === p.id ? p.ann.find(a => a.id === S.sel.aid) : null;
      if (selA && handleHit(selA, x, y, S.zoom)) {
        const b = bbox(selA);
        drag = { mode: 'resize', v, p, a: selA, x0: x, y0: y, b, size0: selA.size, pushed: false };
      } else {
        let target = null;
        for (let i = p.ann.length - 1; i >= 0; i--) if (hit(p.ann[i], x, y, tol)) { target = p.ann[i]; break; }
        const prev = S.sel;
        if (target) {
          S.sel = { pid: p.id, aid: target.id };
          drag = { mode: 'move', v, p, a: target, lx: x, ly: y, pushed: false };
        } else S.sel = null;
        if (prev && prev.pid !== p.id) refresh(prev.pid);
        if (!target) { refresh(p.id); updButtons(); syncProps(); return; }
      }
      if (e.pointerType !== 'mouse') e.preventDefault();
      el.setPointerCapture(e.pointerId);
      refresh(p.id); updButtons(); syncProps();
      return;
    }

    if (tool === 'text') {
      for (let i = p.ann.length - 1; i >= 0; i--) {
        const a = p.ann[i];

      }

      const png = await out.embedPng(new Uint8Array(await blob.arrayBuffer()));
      page.drawImage(png, { x: box.x, y: box.y, width: box.width, height: box.height });
    }
    page.setRotation(degrees((r0 + p.rot) % 360));
    await new Promise(r => setTimeout(r));
  }
  prog.textContent = '書き出し中…';
  return out.save();
}
function download(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function openExport(onlySel) {
  if (!S.pages.length) return;
  commitEditor(true);
  const dlg = $('#dlg');
  $('#outName').value = $('#fname').value || 'document.pdf';
  $('#cntAll').textContent = `(${S.pages.length})`;
  $('#cntSel').textContent = S.tsel.size ? `(${S.tsel.size})` : '— サイドバーで選択';
  $('#rSel').disabled = !S.tsel.size;
  dlg.querySelector(`input[name=range][value=${onlySel && S.tsel.size ? 'sel' : 'all'}]`).checked = true;
  $('#prog').textContent = '';
  $('#optRedWrap').style.display = S.pages.some(p => p.ann.some(a => a.type === 'white')) ? '' : 'none';
  dlg.showModal();
}
$('#dlgForm').addEventListener('submit', async e => {
  if (e.submitter && e.submitter.value !== 'ok') return;
  e.preventDefault();
  const btn = $('#doExport'); btn.disabled = true;
  try {
    const sel = $('#dlgForm').range.value === 'sel';
    const pages = sel ? S.pages.filter(p => S.tsel.has(p.id)) : S.pages;
    const bytes = await buildPdf(pages, $('#optNum').checked, $('#optRed').checked);
    let name = ($('#outName').value || 'document').trim(); if (!/\.pdf$/i.test(name)) name += '.pdf';
    $('#fname').value = name;
    download(bytes, name);
    $('#dlg').close();
    toast(`${pages.length} ページのPDFを保存しました`);
  } catch (err) {
    console.error(err); $('#prog').textContent = '保存に失敗しました'; toast('保存に失敗しました: ' + (err.message || err));
  } finally { btn.disabled = false; }
});

/* ------------ wiring ------------ */
const fileIn = $('#fileIn');
$('#btnOpen').onclick = $('#btnOpen2').onclick = () => fileIn.click();
fileIn.addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('#btnExport').onclick = () => openExport(false);
$('#pExtract').onclick = () => { if (!S.tsel.size && S.pages[S.cur]) S.tsel = new Set([S.pages[S.cur].id]), updThumbSel(); openExport(true); };
$('#pRotL').onclick = () => rotatePages(-90);
$('#pRotR').onclick = () => rotatePages(90);
$('#pDup').onclick = dupPages;
$('#pDel').onclick = deletePages;
$('#pBlank').onclick = insertBlank;
$('#btnUndo').onclick = undo;
$('#btnRedo').onclick = redo;
$('#btnDelAnn').onclick = deleteSelAnn;
$('#btnSide').onclick = () => $('#side').classList.toggle('open');

// file drag & drop
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; (S.pages.length ? $('#dropmask') : $('#drop')).classList.add('on'); });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $('#dropmask').classList.remove('on'); $('#drop').classList.remove('on'); } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('#dropmask').classList.remove('on'); $('#drop').classList.remove('on');
  addFiles(e.dataTransfer.files);
});

// keyboard
const KEYS = { v: 'select', t: 'text', p: 'pen', h: 'hl', r: 'rect', a: 'arrow', w: 'white' };
window.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); openExport(false); return; }
  if (isTyping() || $('#dlg').open) return;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); fileIn.click(); return; }
  if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); setZoom(zStep(1)); return; }
  if (mod && e.key === '-') { e.preventDefault(); setZoom(zStep(-1)); return; }
  if (mod && e.key === '0') { e.preventDefault(); setZoom(fitZoom()); return; }
  if (mod) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { e.preventDefault(); deleteSelAnn(); return; }
  if (e.key === 'Escape') { if (S.sel) { const pid = S.sel.pid; S.sel = null; refresh(pid); updButtons(); syncProps(); } else setTool('select'); return; }
  if (S.sel && e.key.startsWith('Arrow')) {
    e.preventDefault();
    const s = selAnn(); if (!s || !s.a) return;
    const d = e.shiftKey ? 10 : 1, [dx, dy] = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
    const [ux, uy] = ap(rotMat(360 - s.p.rot, 0, 0), dx, dy); // direction only
    if (!e.repeat) pushUndo();
    moveAnn(a2(s.p, s.a), ux, uy); refresh(s.p.id); return;
  }
  const t = KEYS[e.key.toLowerCase()]; if (t) setTool(t);
  if (e.key === 'PageDown' || e.key === 'PageUp') { e.preventDefault(); scrollToPage(S.cur + (e.key === 'PageDown' ? 1 : -1)); }
});

let rzT;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { for (const v of views.values()) { const p = pageById.get(v.id); if (p && v.vis) renderPage(v); } }, 200); });
window.addEventListener('beforeunload', e => { if (S.undo.length) { e.preventDefault(); e.returnValue = ''; } });

setTool('select'); rebuild();
window.__pdfEditor = { S, addFiles, buildPdf };
})();
</script>
</body>
